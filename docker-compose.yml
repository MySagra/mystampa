services:
  mystampa:
    image: mystampa-stampa
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mystampa
    restart: always
    ports:
      - "3032:3032"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - ./assets:/app/assets
      - mystampa_config:/app/data
      - mystampa_logs:/app/logs
    # stdout is also kept by Docker: without a cap it grows without limit
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mystampa_config:
  mystampa_logs:
